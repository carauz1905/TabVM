name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so newly published query patterns reach code that is not changing.
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    # The agent uses Windows-only APIs (COM screen capture, syscall interop), so
    # the Go build CodeQL traces has to run on Windows for the same reason the
    # main CI job does.
    runs-on: windows-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          # Both languages in one init, named explicitly. Leaving this out lets
          # CodeQL auto-detect, which also picks up `actions` -- and the Actions
          # extractor cannot run on a Windows runner, so the job fails at
          # finalize with "could not process any of it".
          languages: go,javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Analyze
        uses: github/codeql-action/analyze@v4
